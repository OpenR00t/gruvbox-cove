# On a version tag (v1.2.3), attach the VS Code extension and the Cove Sans fonts to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package VS Code theme
        working-directory: vscode/gruvbox-cove
        run: npx --yes @vscode/vsce@3 package --allow-missing-repository -o "$GITHUB_WORKSPACE/gruvbox-cove-vscode.vsix"

      - name: Zip Cove Sans
        run: |
          cd fonts/cove-sans
          zip -q "$GITHUB_WORKSPACE/cove-sans.zip" *.ttf LICENSE.txt README.md

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            gruvbox-cove-vscode.vsix
            cove-sans.zip
