# Clear jsDelivr's cache of the files loaded from the CDN (RES stylesheet, Vencord online theme) after they change,
# so the new version is served within minutes instead of up to 12 hours.
name: jsDelivr purge

on:
  push:
    branches: [main]
    paths:
      - reddit/gruvbox-old-reddit.css
      - discord/gruvbox-cove.theme.css
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge
        run: |
          for f in reddit/gruvbox-old-reddit.css discord/gruvbox-cove.theme.css; do
            echo "$f"
            curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f"
            echo
          done
